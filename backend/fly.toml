# fly.toml app configuration file generated for bookkaro-backend
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "bookkaro-backend"
primary_region = "sin" # Singapore (closest low-latency region to India/Asia), or "bom" (Mumbai) if available

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8081"
  SPRING_PROFILES_ACTIVE = "prod"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/api/v1/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
